name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: MultiNest_v3.12_CMake/multinest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev liblapack-dev openmpi-bin libopenmpi-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install -q gcc openblas open-mpi || true
          echo "FC=$(brew --prefix gcc)/bin/gfortran" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Package artifacts
        run: |
          mkdir -p dist/multinest
          cp -r lib   dist/multinest/
          cp -r modules dist/multinest/
          cp -r include dist/multinest/
          tar -czf multinest-${{ matrix.platform }}.tar.gz -C dist multinest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multinest-${{ matrix.platform }}
          path: MultiNest_v3.12_CMake/multinest/multinest-${{ matrix.platform }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout master
        run: git checkout master

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: multinest-*
          merge-multiple: true
          path: artifacts

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          URL="https://github.com/Astro-Lee/MultiNest/archive/refs/tags/v${VERSION}.tar.gz"
          curl -sL "$URL" -o /tmp/multinest.tar.gz
          SHA256=$(shasum -a 256 /tmp/multinest.tar.gz | cut -d' ' -f1)

          FORMULA="Formula/multinest.rb"
          sed -i "s|url \".*\"|url \"$URL\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|" "$FORMULA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "Update formula sha256 for v${VERSION}" || true
          git push origin master

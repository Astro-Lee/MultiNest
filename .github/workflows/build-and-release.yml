name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MultiNest_v3.12_CMake/multinest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev liblapack-dev openmpi-bin libopenmpi-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package artifacts
        run: |
          mkdir -p dist/multinest
          cp -r lib   dist/multinest/
          cp -r bin   dist/multinest/
          cp -r modules dist/multinest/
          cp -r include dist/multinest/
          tar -czf multinest-linux-x86_64.tar.gz -C dist multinest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multinest-linux-x86_64
          path: MultiNest_v3.12_CMake/multinest/multinest-linux-x86_64.tar.gz

      - name: Extract version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MultiNest_v3.12_CMake/multinest/multinest-linux-x86_64.tar.gz
          generate_release_notes: true

      - name: Update Homebrew formula
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          URL="https://github.com/Astro-Lee/MultiNest/archive/refs/tags/v${VERSION}.tar.gz"
          curl -sL "$URL" -o /tmp/multinest.tar.gz
          SHA256=$(shasum -a 256 /tmp/multinest.tar.gz | cut -d' ' -f1)

          git fetch origin master
          git checkout master

          FORMULA="Formula/multinest.rb"
          sed -i "s|url \".*\"|url \"$URL\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|" "$FORMULA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "Update formula sha256 for v${VERSION}" || true
          git push origin master
